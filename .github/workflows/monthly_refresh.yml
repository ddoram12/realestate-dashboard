name: 월간 데이터 갱신

on:
  schedule:
    # 매월 1일 오전 1시 UTC (한국시간 오전 10시)
    - cron: '0 1 1 * *'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 전체 갱신
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DB_PATH: data/realestate.db
        run: python scripts/refresh_data.py --all

      - name: 갱신된 DB 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realestate.db
          git diff --staged --quiet && echo "변경 없음" || \
            git commit -m "data: 월간 데이터 갱신 $(date +'%Y-%m')"
          git push
